name: Inspect DineSafe history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-dinesafe-history.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Toronto current CSV resources
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json, urllib.request
          API='https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          H={'User-Agent':'ryanfeeley/dinesafe GitHub Action'}
          with urllib.request.urlopen(urllib.request.Request(API,headers=H),timeout=60) as r:
              p=json.load(r)['result']
          csvs=[x for x in p.get('resources',[]) if str(x.get('format','')).upper()=='CSV']
          for x in csvs:
              print('\nRESOURCE',repr(x.get('name')),x.get('url'))
              with urllib.request.urlopen(urllib.request.Request(x['url'],headers=H),timeout=120) as r:
                  text=r.read().decode('utf-8-sig',errors='replace')
              rd=csv.DictReader(io.StringIO(text))
              print('HEADERS',rd.fieldnames)
              for i,row in zip(range(5),rd):
                  print('ROW',i,{k:row.get(k) for k in rd.fieldnames})
          PY
