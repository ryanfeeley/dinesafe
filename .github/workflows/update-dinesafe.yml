name: Update DineSafe data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dinesafe.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest DineSafe CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json, urllib.request

          api = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          with urllib.request.urlopen(api, timeout=60) as r:
              package = json.load(r)['result']

          resources = [r for r in package.get('resources', []) if str(r.get('format', '')).upper() == 'CSV' and r.get('url')]
          if not resources:
              raise SystemExit('No CSV resource found in Toronto DineSafe package')

          preferred = next((r for r in resources if 'dinesafe.csv' in r['url'].lower()), resources[0])
          url = preferred['url']
          print('Downloading:', url)
          req = urllib.request.Request(url, headers={'User-Agent': 'ryanfeeley/dinesafe GitHub Action'})
          with urllib.request.urlopen(req, timeout=120) as r, open('data/dinesafe.csv', 'wb') as f:
              f.write(r.read())
          PY

          test -s data/dinesafe.csv
          head -n 1 data/dinesafe.csv

      - name: Configure site to use same-origin data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_api = "const API = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe';"
          old_csv = "const FALLBACK_CSV = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/b6b4f3fb-2e2c-47e7-931d-b87d22806948/resource/af0f5b8a-4b73-4a50-8781-65e949792b40/download/dinesafe.csv';"
          s = s.replace(old_api, "const API = './data/dinesafe.csv';")
          s = s.replace(old_csv, "const FALLBACK_CSV = './data/dinesafe.csv';")
          s = s.replace("status(esc(e.message)+' Serve this page over HTTPS or localhost.',true);", "status('DineSafe data could not be loaded: '+esc(e.message),true);")
          p.write_text(s)
          PY

      - name: Commit updated site data
        shell: bash
        run: |
          if git diff --quiet -- index.html data/dinesafe.csv; then
            echo "DineSafe data and site are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/dinesafe.csv
          git commit -m "Update DineSafe data"
          git push
