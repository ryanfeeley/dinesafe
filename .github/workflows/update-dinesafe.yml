name: Update DineSafe data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest DineSafe CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json, urllib.request

          api = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          with urllib.request.urlopen(api, timeout=60) as r:
              package = json.load(r)['result']

          resources = [r for r in package.get('resources', []) if str(r.get('format', '')).upper() == 'CSV' and r.get('url')]
          if not resources:
              raise SystemExit('No CSV resource found in Toronto DineSafe package')

          preferred = next((r for r in resources if 'dinesafe.csv' in r['url'].lower()), resources[0])
          url = preferred['url']
          print('Downloading:', url)
          req = urllib.request.Request(url, headers={'User-Agent': 'ryanfeeley/dinesafe GitHub Action'})
          with urllib.request.urlopen(req, timeout=120) as r, open('data/dinesafe.csv', 'wb') as f:
              f.write(r.read())
          PY

          test -s data/dinesafe.csv
          head -n 1 data/dinesafe.csv

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/dinesafe.csv; then
            echo "DineSafe data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dinesafe.csv
          git commit -m "Update DineSafe data"
          git push
