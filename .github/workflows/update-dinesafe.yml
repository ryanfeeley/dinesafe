name: Update DineSafe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dinesafe.yml'
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and normalize latest DineSafe data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import csv, io, json, urllib.request
          from datetime import datetime

          API = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          headers = {'User-Agent': 'ryanfeeley/dinesafe GitHub Action'}

          with urllib.request.urlopen(urllib.request.Request(API, headers=headers), timeout=60) as r:
              package = json.load(r)['result']

          resources = [x for x in package.get('resources', [])
                       if str(x.get('format', '')).upper() == 'CSV' and x.get('url')]
          if not resources:
              raise SystemExit('No CSV resource found in Toronto DineSafe package')

          resource = next((x for x in resources if 'dinesafe.csv' in x['url'].lower()), resources[0])
          with urllib.request.urlopen(urllib.request.Request(resource['url'], headers=headers), timeout=120) as r:
              text = r.read().decode('utf-8-sig')

          def pick(row, *names):
              norm = {''.join(c for c in k.lower() if c.isalnum()): (v or '').strip()
                      for k, v in row.items() if k}
              for name in names:
                  v = norm.get(''.join(c for c in name.lower() if c.isalnum()), '')
                  if v:
                      return v
              return ''

          latest = {}
          for row in csv.DictReader(io.StringIO(text)):
              est_id = pick(row, 'estId', 'establishment_id', 'establishmentId', 'oldEstId')
              name = pick(row, 'estName', 'establishment_name', 'establishmentName', 'name')
              address = pick(row, 'address', 'establishment_address', 'establishmentAddress')
              date = pick(row, 'inspectionDate', 'inspection_date', 'date')
              status = pick(row, 'inspectionStatus', 'inspection_status', 'establishmentStatus', 'status')
              lat = pick(row, 'latitude', 'lat')
              lon = pick(row, 'longitude', 'lon', 'lng')
              if not (name and date and lat and lon):
                  continue
              try:
                  parsed = datetime.fromisoformat(date[:10])
                  float(lat); float(lon)
              except ValueError:
                  continue
              key = est_id or f'{name}|{address}'
              prev = latest.get(key)
              if prev is None or parsed > prev['_date']:
                  latest[key] = {
                      '_date': parsed,
                      'ESTABLISHMENT_ID': est_id,
                      'ESTABLISHMENT_NAME': name,
                      'ESTABLISHMENT_ADDRESS': address,
                      'ESTABLISHMENT_TYPE': 'Restaurant / food premises',
                      'INSPECTION_DATE': parsed.date().isoformat(),
                      'ESTABLISHMENT_STATUS': status,
                      'LATITUDE': lat,
                      'LONGITUDE': lon
                  }

          records = sorted(latest.values(), key=lambda x: x['_date'], reverse=True)
          if not records:
              raise SystemExit('Normalization produced zero establishments')

          fields = ['ESTABLISHMENT_ID','ESTABLISHMENT_NAME','ESTABLISHMENT_ADDRESS',
                    'ESTABLISHMENT_TYPE','INSPECTION_DATE','ESTABLISHMENT_STATUS',
                    'LATITUDE','LONGITUDE']
          with open('data/dinesafe.csv', 'w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for rec in records:
                  rec.pop('_date', None)
                  writer.writerow(rec)

          print(f'Wrote {len(records)} establishments to data/dinesafe.csv')
          PY

          test -s data/dinesafe.csv
          head -n 3 data/dinesafe.csv

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/dinesafe.csv; then
            echo "DineSafe data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dinesafe.csv
          git commit -m "Update normalized DineSafe data"
          git push
