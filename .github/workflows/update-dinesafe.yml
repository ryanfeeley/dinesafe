name: Update DineSafe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dinesafe.yml'
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and normalize latest DineSafe data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import csv, io, json, re, urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta

          API = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          HEADERS = {'User-Agent': 'ryanfeeley/dinesafe GitHub Action (+https://dinesafe.ryanfeeley.com)'}

          with urllib.request.urlopen(urllib.request.Request(API, headers=HEADERS), timeout=60) as r:
              package = json.load(r)['result']

          resources = [x for x in package.get('resources', []) if str(x.get('format', '')).upper() == 'CSV' and x.get('url')]
          if not resources:
              raise SystemExit('No CSV resource found in Toronto DineSafe package')

          resource = next((x for x in resources if 'dinesafe.csv' in x['url'].lower()), resources[0])
          with urllib.request.urlopen(urllib.request.Request(resource['url'], headers=HEADERS), timeout=120) as r:
              text = r.read().decode('utf-8-sig')

          reader = csv.DictReader(io.StringIO(text))
          if not reader.fieldnames:
              raise SystemExit('Toronto DineSafe CSV has no header row')

          print('Toronto headers:', reader.fieldnames)

          def norm_key(s):
              return re.sub(r'[^a-z0-9]', '', (s or '').lower())

          def pick(row, *names):
              norm = {norm_key(k): (v or '').strip() for k, v in row.items() if k}
              for name in names:
                  v = norm.get(norm_key(name), '')
                  if v:
                      return v
              return ''

          def norm_text(s):
              return re.sub(r'[^a-z0-9]+', ' ', (s or '').lower()).strip()

          non_dining = re.compile(r'\b(child\s*care|day\s*care|montessori|nursery|school|academy|college|university|student\s+nutrition|hospital|health\s*(service|centre|center)|long[\s-]*term\s+care|nursing\s+home|retirement|seniors?|shelter|food\s+bank|community\s+(centre|center|kitchen)|recreation\s+(centre|center)|ymca|ywca|church|mosque|synagogue|temple|congregation|parish|supermarket|grocery|convenience|variety\s+store|food\s+store|pharmacy|drug\s*mart|butcher|meat\s+(market|shop)|fish\s+market|produce\s+market|warehouse|wholesale|manufactur|commissary|caterer|catering|vending|correctional|detention|group\s+home)\b', re.I)

          # Union-find lets the new ID, legacy ID and unchanged name/address all
          # contribute to one establishment history instead of fragmenting it.
          parent = {}
          rank = {}
          def add(x):
              if x not in parent:
                  parent[x] = x
                  rank[x] = 0
          def find(x):
              add(x)
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x
          def union(a, b):
              ra, rb = find(a), find(b)
              if ra == rb:
                  return
              if rank[ra] < rank[rb]:
                  ra, rb = rb, ra
              parent[rb] = ra
              if rank[ra] == rank[rb]:
                  rank[ra] += 1

          parsed_rows = []
          source_rows = 0
          for row in reader:
              source_rows += 1
              est_id = pick(row, 'estId', 'establishment_id', 'establishmentId')
              old_id = pick(row, 'oldEstId', 'old_establishment_id')
              name = pick(row, 'estName', 'establishment_name', 'establishmentName', 'name')
              address = pick(row, 'address', 'establishment_address', 'establishmentAddress')
              date = pick(row, 'inspectionDate', 'inspection_date', 'date')
              status = pick(row, 'inspectionStatus', 'inspection_status', 'establishmentStatus', 'status')
              inspection_id = pick(row, 'inspectionId', 'inspection_id')
              lat = pick(row, 'latitude', 'lat')
              lon = pick(row, 'longitude', 'lon', 'lng')
              if not (name and address and date and lat and lon):
                  continue
              try:
                  parsed = datetime.fromisoformat(date[:10]).replace(tzinfo=timezone.utc)
                  latf, lonf = float(lat), float(lon)
              except ValueError:
                  continue
              if not (43.4 <= latf <= 44.0 and -80.0 <= lonf <= -78.8):
                  continue

              tokens = []
              if est_id:
                  tokens.append('new:' + est_id)
              if old_id:
                  tokens.append('old:' + old_id)
              # This conservative bridge catches ID migrations where the name
              # and address stayed the same. False negatives are preferable to
              # showing a longstanding business as new.
              tokens.append('nameaddr:' + norm_text(name) + '|' + norm_text(address))
              for token in tokens:
                  add(token)
              for token in tokens[1:]:
                  union(tokens[0], token)

              parsed_rows.append({
                  'token': tokens[0],
                  'est_id': est_id,
                  'old_id': old_id,
                  'name': name,
                  'address': address,
                  'date': parsed,
                  'status': status,
                  'inspection_id': inspection_id,
                  'lat': latf,
                  'lon': lonf,
              })

          events = defaultdict(set)
          latest = {}
          earliest = {}
          for row in parsed_rows:
              root = find(row['token'])
              event = ('id:' + row['inspection_id']) if row['inspection_id'] else ('date:' + row['date'].date().isoformat() + '|status:' + row['status'].strip().lower())
              events[root].add(event)
              if root not in earliest or row['date'] < earliest[root]:
                  earliest[root] = row['date']
              if root not in latest or row['date'] > latest[root]['date']:
                  latest[root] = row

          records = []
          for root, row in latest.items():
              dining = 0 if non_dining.search(f"{row['name']} {row['address']}") else 1
              records.append({
                  '_date': row['date'],
                  'ESTABLISHMENT_ID': row['est_id'] or row['old_id'],
                  'OLD_ESTABLISHMENT_ID': row['old_id'],
                  'ESTABLISHMENT_NAME': row['name'],
                  'ESTABLISHMENT_ADDRESS': row['address'],
                  'ESTABLISHMENT_TYPE': 'Dining-focused (derived)' if dining else 'Other food premises',
                  'DINING': dining,
                  'INSPECTION_COUNT': len(events[root]),
                  'FIRST_INSPECTION_DATE': earliest[root].date().isoformat(),
                  'INSPECTION_DATE': row['date'].date().isoformat(),
                  'ESTABLISHMENT_STATUS': row['status'],
                  'LATITUDE': f"{row['lat']:.9f}".rstrip('0').rstrip('.'),
                  'LONGITUDE': f"{row['lon']:.9f}".rstrip('0').rstrip('.'),
              })

          records.sort(key=lambda x: x['_date'], reverse=True)
          if len(records) < 5000:
              raise SystemExit(f'Normalization produced only {len(records)} establishments from {source_rows} source rows')
          newest = records[0]['_date']
          if newest < datetime.now(timezone.utc) - timedelta(days=14):
              raise SystemExit(f'DineSafe source appears stale; newest inspection is {newest.date()}')

          fields = ['ESTABLISHMENT_ID','OLD_ESTABLISHMENT_ID','ESTABLISHMENT_NAME','ESTABLISHMENT_ADDRESS','ESTABLISHMENT_TYPE','DINING','INSPECTION_COUNT','FIRST_INSPECTION_DATE','INSPECTION_DATE','ESTABLISHMENT_STATUS','LATITUDE','LONGITUDE']
          with open('data/dinesafe.csv', 'w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for rec in records:
                  rec.pop('_date', None)
                  writer.writerow(rec)

          new_records = [r for r in records if int(r['INSPECTION_COUNT']) == 1]
          print(f'Source rows: {source_rows}')
          print(f'Merged establishments: {len(records)}')
          print(f'Establishments with exactly one inspection in full published history: {len(new_records)}')
          print(f'Oldest first inspection among one-inspection establishments: {min((r["FIRST_INSPECTION_DATE"] for r in new_records), default="none")}')
          print(f'Newest inspection: {newest.date()}')
          PY

          test -s data/dinesafe.csv
          head -n 3 data/dinesafe.csv

      - name: Validate site data
        shell: bash
        run: |
          node --check app.js
          grep -q '^ESTABLISHMENT_ID,OLD_ESTABLISHMENT_ID,ESTABLISHMENT_NAME,ESTABLISHMENT_ADDRESS,ESTABLISHMENT_TYPE,DINING,INSPECTION_COUNT,FIRST_INSPECTION_DATE' data/dinesafe.csv

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/dinesafe.csv; then
            echo "DineSafe data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dinesafe.csv
          git commit -m "Merge DineSafe establishment histories"
          git push
