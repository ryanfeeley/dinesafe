name: Update DineSafe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dinesafe.yml'
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build current establishments with full inspection history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import csv, io, json, re, urllib.request, zipfile
          from collections import defaultdict, Counter
          from datetime import datetime, timezone, timedelta

          API='https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=dinesafe'
          HEADERS={'User-Agent':'ryanfeeley/dinesafe GitHub Action (+https://dinesafe.ryanfeeley.com)'}
          NULLS={'','none','null','nan','n/a','na','nil'}

          def download(url, timeout=180):
              with urllib.request.urlopen(urllib.request.Request(url,headers=HEADERS),timeout=timeout) as r:
                  return r.read()

          with urllib.request.urlopen(urllib.request.Request(API,headers=HEADERS),timeout=60) as r:
              package=json.load(r)['result']
          resources=package.get('resources',[])
          current_res=next((x for x in resources if str(x.get('format','')).upper()=='CSV' and str(x.get('name','')).lower()=='dinesafe.csv'),None)
          hist_res=next((x for x in resources if 'histor' in str(x.get('name','')).lower()),None)
          if not current_res or not hist_res:
              raise SystemExit('Could not find current CSV and historical ZIP resources')

          def clean(v):
              s=(v or '').strip()
              return '' if s.lower() in NULLS else s
          def nk(s): return re.sub(r'[^a-z0-9]','',(s or '').lower())
          def rowmap(row): return {nk(k): clean(v) for k,v in row.items() if k}
          def pick(m,*names):
              for name in names:
                  v=m.get(nk(name),'')
                  if v: return v
              return ''
          def parse_date(s):
              s=clean(s)
              for fmt in ('%Y-%m-%d','%m/%d/%Y','%Y/%m/%d','%Y-%m-%d %H:%M:%S'):
                  try: return datetime.strptime(s[:19],fmt).replace(tzinfo=timezone.utc)
                  except ValueError: pass
              try: return datetime.fromisoformat(s[:10]).replace(tzinfo=timezone.utc)
              except ValueError: return None
          def norm_name(s): return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()
          def norm_address(s):
              s=(s or '').lower()
              s=re.sub(r'\bnone\b',' ',s)
              s=re.sub(r'\b[a-z]\d[a-z][ -]?\d[a-z]\d\b',' ',s)
              s=re.sub(r'\btoronto\b|\bontario\b|\bon\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          def geo_token(name,lat,lon):
              try: return f"namegeo:{norm_name(name)}|{float(lat):.4f}|{float(lon):.4f}"
              except (TypeError,ValueError): return ''

          parent={}; rank={}
          def add(x):
              if x and x not in parent: parent[x]=x; rank[x]=0
          def find(x):
              add(x)
              while parent[x]!=x:
                  parent[x]=parent[parent[x]]; x=parent[x]
              return x
          def union(a,b):
              if not a or not b: return
              ra,rb=find(a),find(b)
              if ra==rb:return
              if rank[ra]<rank[rb]:ra,rb=rb,ra
              parent[rb]=ra
              if rank[ra]==rank[rb]:rank[ra]+=1
          def link(tokens):
              tokens=[x for x in tokens if x]
              if not tokens:return ''
              for x in tokens:add(x)
              for x in tokens[1:]:union(tokens[0],x)
              return tokens[0]

          all_rows=[]
          historical_rows=0
          hist_zip=zipfile.ZipFile(io.BytesIO(download(hist_res['url'])))
          for filename in hist_zip.namelist():
              if not filename.lower().endswith('.csv'): continue
              raw=hist_zip.read(filename).decode('utf-8-sig',errors='replace')
              if raw.startswith('""Rec #"'): raw=raw[1:]
              reader=csv.DictReader(io.StringIO(raw))
              for row in reader:
                  m=rowmap(row)
                  legacy=pick(m,'Establishment ID','establishmentId')
                  insp=pick(m,'Inspection ID','inspectionId')
                  name=pick(m,'Establishment Name','establishmentName')
                  typ=pick(m,'Establishment Type','establishmentType')
                  address=pick(m,'Establishment Address','establishmentAddress')
                  date=parse_date(pick(m,'Inspection Date','inspectionDate'))
                  status=pick(m,'Establishment Status','establishmentStatus')
                  lat=pick(m,'Latitude','lat'); lon=pick(m,'Longitude','lon','lng')
                  if not (legacy and name and address and date): continue
                  tokens=[f'legacy:{legacy}',f'nameaddr:{norm_name(name)}|{norm_address(address)}',geo_token(name,lat,lon)]
                  token=link(tokens)
                  all_rows.append({'source':'hist','token':token,'inspection_id':insp,'date':date,'status':status,'name':name,'type':typ,'address':address,'lat':lat,'lon':lon})
                  historical_rows+=1

          current_rows=0
          current_text=download(current_res['url'],120).decode('utf-8-sig',errors='replace')
          reader=csv.DictReader(io.StringIO(current_text))
          for row in reader:
              m=rowmap(row)
              est_id=pick(m,'estId','establishment_id','establishmentId')
              old_id=pick(m,'oldEstId','old_establishment_id')
              name=pick(m,'estName','establishment_name','establishmentName','name')
              address=pick(m,'address','establishment_address','establishmentAddress')
              date=parse_date(pick(m,'inspectionDate','inspection_date','date'))
              status=pick(m,'inspectionStatus','inspection_status','establishmentStatus','status')
              lat=pick(m,'latitude','lat'); lon=pick(m,'longitude','lon','lng')
              if not (est_id and name and address and date and lat and lon): continue
              try:
                  latf,lonf=float(lat),float(lon)
                  if not (43.4<=latf<=44.0 and -80.0<=lonf<=-78.8): continue
              except ValueError: continue
              tokens=[f'current:{est_id}']
              if old_id: tokens.append(f'legacy:{old_id}')
              tokens.extend([f'nameaddr:{norm_name(name)}|{norm_address(address)}',geo_token(name,lat,lon)])
              token=link(tokens)
              all_rows.append({'source':'current','token':token,'est_id':est_id,'old_id':old_id,'date':date,'status':status,'name':name,'address':re.sub(r'\s+',' ',re.sub(r'\bNone\b',' ',address,flags=re.I)).strip(),'lat':latf,'lon':lonf})
              current_rows+=1

          hist_ids=defaultdict(set)
          hist_pairs=defaultdict(set)
          current_pairs=defaultdict(set)
          earliest={}
          latest_current={}
          latest_hist_type={}
          for row in all_rows:
              root=find(row['token'])
              pair=(row['date'].date().isoformat(),(row['status'] or '').strip().lower())
              if row['source']=='hist':
                  if row.get('inspection_id'): hist_ids[root].add(row['inspection_id'])
                  hist_pairs[root].add(pair)
                  if row.get('type') and (root not in latest_hist_type or row['date']>latest_hist_type[root][0]):
                      latest_hist_type[root]=(row['date'],row['type'])
              else:
                  current_pairs[root].add(pair)
                  if root not in latest_current or row['date']>latest_current[root]['date']:
                      latest_current[root]=row
              if root not in earliest or row['date']<earliest[root]: earliest[root]=row['date']

          dining_type_re=re.compile(r'(restaurant|food\s*take\s*out|cafe|café|coffee|cocktail\s*bar|beverage\s*room|bar\b|pub\b|tavern)',re.I)
          non_dining_name_re=re.compile(r'\b(child\s*care|day\s*care|montessori|nursery|school|academy|college|university|student|hospital|health\s*(service|centre|center)|medical|clinic|long[\s-]*term\s+care|nursing|retirement|seniors?|shelter|food\s+bank|community\s+(centre|center|kitchen)|recreation\s+(centre|center)|ymca|ywca|church|mosque|synagogue|temple|congregation|parish|supermarket|grocery|convenience|variety\s+store|food\s+store|pharmacy|drug\s*mart|butcher|meat\s+(market|shop)|fish\s+market|produce\s+market|warehouse|wholesale|manufactur|commissary|caterer|catering|vending|correctional|detention|group\s+home|residence|clubhouse|arena|stadium|school\s+nutrition)\b',re.I)

          records=[]
          for root,row in latest_current.items():
              count=len(hist_ids[root])
              if not hist_ids[root]: count+=len(hist_pairs[root])
              count+=len(current_pairs[root]-hist_pairs[root])

              hist_type=latest_hist_type.get(root,(None,''))[1]
              if hist_type:
                  dining=1 if dining_type_re.search(hist_type) else 0
                  display_type=hist_type
              else:
                  # The current 2024+ feed no longer exposes establishment type.
                  # For genuinely new IDs, default to dining unless the name is
                  # clearly an institutional/retail/non-dining premise. This is
                  # deliberately recall-oriented for new restaurants with names
                  # that do not include words such as “restaurant” or “cafe”.
                  dining=0 if non_dining_name_re.search(row['name']) else 1
                  display_type='Dining-focused' if dining else 'Other food premises (derived)'

              records.append({
                  '_date':row['date'],
                  'ESTABLISHMENT_ID':row['est_id'],
                  'OLD_ESTABLISHMENT_ID':row.get('old_id',''),
                  'ESTABLISHMENT_NAME':row['name'],
                  'ESTABLISHMENT_ADDRESS':row['address'],
                  'ESTABLISHMENT_TYPE':display_type,
                  'DINING':dining,
                  'INSPECTION_COUNT':count,
                  'FIRST_INSPECTION_DATE':earliest[root].date().isoformat(),
                  'INSPECTION_DATE':row['date'].date().isoformat(),
                  'ESTABLISHMENT_STATUS':row['status'],
                  'LATITUDE':f"{row['lat']:.9f}".rstrip('0').rstrip('.'),
                  'LONGITUDE':f"{row['lon']:.9f}".rstrip('0').rstrip('.'),
              })

          records.sort(key=lambda x:x['_date'],reverse=True)
          if len(records)<10000: raise SystemExit(f'Only {len(records)} current establishments after history merge')
          newest=records[0]['_date']
          if newest<datetime.now(timezone.utc)-timedelta(days=14): raise SystemExit(f'Current feed stale: {newest.date()}')

          fields=['ESTABLISHMENT_ID','OLD_ESTABLISHMENT_ID','ESTABLISHMENT_NAME','ESTABLISHMENT_ADDRESS','ESTABLISHMENT_TYPE','DINING','INSPECTION_COUNT','FIRST_INSPECTION_DATE','INSPECTION_DATE','ESTABLISHMENT_STATUS','LATITUDE','LONGITUDE']
          with open('data/dinesafe.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for rec in records:
                  rec.pop('_date',None);w.writerow(rec)

          new=[r for r in records if int(r['INSPECTION_COUNT'])==1]
          dining_new=[r for r in new if int(r['DINING'])==1]
          print('Historical source rows:',historical_rows)
          print('Current source rows:',current_rows)
          print('Current establishments:',len(records))
          print('Exactly one inspection across 2001-present:',len(new))
          print('Dining-focused one-inspection establishments:',len(dining_new))
          print('Oldest first inspection among dining one-inspection establishments:',min((r['FIRST_INSPECTION_DATE'] for r in dining_new),default='none'))
          print('Newest current inspection:',newest.date())
          print('Top dining-new examples:',[(r['ESTABLISHMENT_NAME'],r['ESTABLISHMENT_TYPE'],r['FIRST_INSPECTION_DATE']) for r in dining_new[:20]])
          print('Historical type coverage for current establishments:',sum(1 for root in latest_current if root in latest_hist_type))
          PY

          test -s data/dinesafe.csv
          head -n 3 data/dinesafe.csv

      - name: Validate site data
        shell: bash
        run: |
          node --check app.js
          grep -q '^ESTABLISHMENT_ID,OLD_ESTABLISHMENT_ID,ESTABLISHMENT_NAME,ESTABLISHMENT_ADDRESS,ESTABLISHMENT_TYPE,DINING,INSPECTION_COUNT,FIRST_INSPECTION_DATE' data/dinesafe.csv

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/dinesafe.csv; then
            echo "DineSafe data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dinesafe.csv
          git commit -m "Fix dining classification for new establishments"
          git push
